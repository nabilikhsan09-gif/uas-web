{% extends "base.html" %}
{% block title %}Masuk - SIGAP{% endblock %}

{% block content %}
<section class="wrap auth-wrap">
  <div class="form-card">
    <h2>Masuk ke SIGAP</h2>
    <p style="color:var(--text-soft); font-size:.9rem; margin-top:-8px;">Akun demo petugas: <strong>admin@sigap.local</strong> / <strong>admin123</strong></p>

    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>

    <p class="auth-note">Belum punya akun? <a href="{{ url_for('register') }}" style="color:var(--rust); font-weight:600;">Daftar di sini</a></p>
  </div>
</section>
{% endblock %}
